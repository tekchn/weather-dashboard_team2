<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard Yogyakarta</title>

    <link rel="stylesheet" href="style.css">

    <!-- Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Weather Dashboard</h1>
        <h2>📍 Yogyakarta</h2>

        <div class="weather">

            <div class="icon">
                ☀️
            </div>

            <div class="temp" id="temperature">
                29°C
            </div>

            <div class="condition" id="condition">
                Sunny
            </div>

            <div class="date" id="date">
                Sunday
            </div>

        </div>

        <div class="details">

            <div class="box">
                <i class="fa-solid fa-temperature-half"></i>
                <h3>Feels Like</h3>
                <p>31°C</p>
            </div>

            <div class="box">
                <i class="fa-solid fa-droplet"></i>
                <h3>Humidity</h3>
                <p>75%</p>
            </div>

            <div class="box">
                <i class="fa-solid fa-wind"></i>
                <h3>Wind</h3>
                <p>10 km/h</p>
            </div>

            <div class="box">
                <i class="fa-solid fa-sun"></i>
                <h3>UV Index</h3>
                <p>8</p>
            </div>

        </div>

        <h3 class="forecast-title">
            Today's Forecast
        </h3>

        <div class="forecast">

            <div>08:00<br>☀️<br>26°</div>
            <div>11:00<br>🌤️<br>29°</div>
            <div>14:00<br>☀️<br>31°</div>
            <div>17:00<br>🌥️<br>28°</div>
            <div>20:00<br>🌙<br>25°</div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
